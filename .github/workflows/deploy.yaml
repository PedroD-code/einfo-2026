name: CI Docker

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build e Push GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Converter owner para minúsculo
        run: echo "REPO_OWNER=${pedrod-code,,}" >> $GITHUB_ENV

      - name: Build da imagem
        run: |
          docker build \
            -t ghcr.io/${{ env.pedrod-code }}/projeto-einfo:v1 .

      - name: Push da imagem
        run: |
          docker push ghcr.io/${{ env.pedrod-code }}/projeto-einfo:v1